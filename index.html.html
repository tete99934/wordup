let day=0,idx=0,tab='study',quiz=null,answered=-1,reviewIdx=0;

let saved={};try{saved=JSON.parse(localStorage.getItem('wordup_simple_v3')||'{}')}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const examples={resume:['Please submit your resume by Friday.','금요일까지 이력서를 제출해 주세요.'],opening:['There is an opening in the sales department.','영업 부서에 공석이 있습니다.'],applicant:['The applicant has relevant experience for this position.','그 지원자는 이 직무와 관련된 경험이 있습니다.'],requirement:['Experience is a requirement for this job.','경력은 이 직무의 필수 조건입니다.'],qualified:['She is qualified for the position.','그녀는 그 직무에 적합한 자격을 갖추었습니다.'],candidate:['We interviewed three candidates.','우리는 후보자 세 명을 면접했습니다.'],interview:['I have a job interview tomorrow.','저는 내일 채용 면접이 있습니다.'],hire:['The company plans to hire more employees.','회사는 직원을 더 채용할 계획입니다.'],training:['All employees must complete the training.','모든 직원은 교육을 이수해야 합니다.'],reference:['Please provide two professional references.','직무 관련 추천인 두 명을 알려 주세요.'],position:['She applied for the position.','그녀는 그 직책에 지원했습니다.'],graduation:['He found a job after graduation.','그는 졸업 후 일자리를 구했습니다.'],payroll:['The payroll is processed every month.','급여 명부는 매달 처리됩니다.']};
function context(w){let ex=examples[w.w.toLowerCase()];$('example').innerHTML=ex?`<div>${esc(ex[0])} <button style="background:transparent;color:#176bea" onclick="speak(${JSON.stringify(ex[0]).replace(/"/g,'&quot;')})">🔊</button></div><div class="kr">${esc(ex[1])}</div>`:'<span style="color:#8c96a9">이 단어의 예문은 준비 중입니다.</span>';
let d=DATA[day],loc=d.words.findIndex(x=>x.n===w.n);let group=[...d.words.slice(Math.max(0,loc-2),loc),...d.words.slice(loc+1,loc+5)].slice(0,4);$('related').innerHTML=group.map(x=>`<button onclick="idx=${d.words.indexOf(x)};tab='study';render()"><strong>${esc(x.w)}</strong><span>${esc(x.m)}</span></button>`).join('')}

function newQuiz(){let pool=DATA[day].words,w=pool[Math.floor(Math.random()*pool.length)],wrong=pool.filter(x=>x.n!==w.n&&x.m!==w.m).sort(()=>Math.random()-.5).slice(0,3);quiz={w,opts:[w,...wrong].sort(()=>Math.random()-.5)};answered=-1;tab='quiz';render()}
function choose(i){if(answered!==-1)return;answered=i;if(quiz.opts[i].n===quiz.w.n){saved[key({...quiz.w,day:DATA[day].day})]=true;save()}render()}
function renderQuiz(){if(!quiz){newQuiz();return}let q=quiz;$('content').innerHTML=`<div class="center"><p>영어 단어의 뜻을 고르세요</p><div class="word">${esc(q.w.w)}</div><button class="btn" onclick="speak(quiz.w.w)">🔊 발음 듣기</button><div class="quizoptions">${q.opts.map((o,i)=>`<button class="${answered>=0?(o.n===q.w.n?'correct':i===answered?'wrong':''):''}" onclick="choose(${i})">${i+1}. ${esc(o.m)}</button>`).join('')}</div>${answered>=0?`<p>${q.opts[answered].n===q.w.n?'정답!':'오답'} · ${esc(q.w.m)}</p><button class="btn primary" onclick="newQuiz()">다음 문제 →</button>`:''}</div>`;context({...q.w,day:DATA[day].day})}
function backup(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(saved));a.download='wordup_backup.json';a.click()}
async function restoreFile(f){if(!f)return;try{let v=JSON.parse(await f.text());if(!v||typeof v!=='object'||Array.isArray(v))throw Error();saved=v;save();render();alert('복원 완료')}catch(e){alert('올바른 백업 파일이 아닙니다.')}}render();
